# PostgreSQL 18 - Node 3 (pg3) - Standby / Follower

listen_addresses = '*'
port = 5432

# Hot standby - allow read queries on replica
hot_standby = on

# Primary connection for streaming replication
primary_conninfo = 'host=pg1 port=5432 user=replicator password=${REPLICATOR_PASSWORD} application_name=pg3'
primary_slot_name = 'replica_pg3'

# Connection
max_connections = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '[pg3] %t [%p]: user=%u,db=%d,app=%a,client=%h '

# Performance (dev)
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
