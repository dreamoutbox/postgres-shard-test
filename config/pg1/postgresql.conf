# PostgreSQL 18 - Node 1 (pg1) - Coordinator Node

listen_addresses = '*'
port = 5432

# Connection
max_connections = 200

# Distributed 2PC support for postgres_fdw
max_prepared_transactions = 20

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '[pg1-coordinator] %t [%p]: user=%u,db=%d,app=%a,client=%h '

# Performance (dev)
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
