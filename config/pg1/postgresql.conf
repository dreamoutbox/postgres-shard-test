# PostgreSQL 18 - Node 1 (pg1) - Primary / Leader

listen_addresses = '*'
port = 5432

# Replication
wal_level = replica
max_replication_slots = 10
max_wal_senders = 10
wal_keep_size = 256MB

# Connection
max_connections = 200

# Logging
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '[pg1] %t [%p]: user=%u,db=%d,app=%a,client=%h '

# Performance (dev)
shared_buffers = 128MB
effective_cache_size = 512MB
maintenance_work_mem = 64MB
