volumes:
  pg1_data:
  pg2_data:
  pg3_data:

services:
  pg1:
    image: postgres:18
    container_name: pg1
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB}
      APP_DB: ${APP_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg1_data:/var/lib/postgresql
      - ./config/pg1/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg1/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init-pg1.sh:/docker-entrypoint-initdb.d/init-pg1.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  pg2:
    image: postgres:18
    container_name: pg2
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB}
      APP_DB: ${APP_DB}
    ports:
      - "5433:5432"
    volumes:
      - pg2_data:/var/lib/postgresql
      - ./config/pg2/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg2/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init-pg2.sh:/docker-entrypoint-initdb.d/init-pg2.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  pg3:
    image: postgres:18
    container_name: pg3
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_DB}
      APP_DB: ${APP_DB}
    ports:
      - "5434:5432"
    volumes:
      - pg3_data:/var/lib/postgresql
      - ./config/pg3/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg3/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./scripts/init-pg3.sh:/docker-entrypoint-initdb.d/init-pg3.sh:ro
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      - pgnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${APP_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  pgnet:
    driver: bridge
